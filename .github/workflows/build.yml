name: Build Prime CG APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o PrimeCG_App.zip -d extracted
          ls -la extracted

      - name: Move project files to root
        run: |
          INNER_DIR=$(find extracted -maxdepth 2 -name "build.gradle" -not -path "*/app/*" | head -1 | xargs dirname)
          echo "Found project at: $INNER_DIR"
          cp -r "$INNER_DIR"/. .
          ls -la

      - name: Fix missing app icon references
        run: |
          sed -i '/android:icon="@mipmap\/ic_launcher"/d' app/src/main/AndroidManifest.xml
          sed -i '/android:roundIcon="@mipmap\/ic_launcher_round"/d' app/src/main/AndroidManifest.xml

      - name: Fix invalid android:gap attribute
        run: |
          sed -i '/android:gap=/d' app/src/main/res/layout/activity_settings.xml
          grep -n "gap" app/src/main/res/layout/activity_settings.xml || echo "No more gap attributes found - clean!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeCG-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
